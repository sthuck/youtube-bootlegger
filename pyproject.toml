[project]
name = "youtube-bootlegger"
version = "0.1.0"
description = "Download and split YouTube live performance audio into individual song files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.80.0",
    "mutagen>=1.47.0",
    "pydantic>=2.0.0",
    "pyside6>=6.10.2",
    "yt-dlp>=2026.2.21",
]

[project.scripts]
youtube-bootlegger = "youtube_bootlegger.app:run"

[dependency-groups]
dev = [
    "imageio>=2.37.3",
    "nuitka>=4.0.1",
    "pillow>=12.3.0",
    "pip>=26.0.1",
    "pyinstaller>=6.19.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
youtube_bootlegger = ["assets/*.png", "assets/*.svg", "qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
