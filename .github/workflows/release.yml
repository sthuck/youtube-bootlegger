name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-14
            platform: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Keep the virtualenv outside the project directory so pyside6-deploy
      # doesn't bundle it into the executable as project data.
      - name: Set virtualenv location
        run: echo "UV_PROJECT_ENVIRONMENT=${{ runner.temp }}/ytb-venv" >> "$GITHUB_ENV"
        shell: bash

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-dev libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-xkb1 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0

      - name: Install dependencies
        run: uv sync --dev

      - name: Build executable with pyside6-deploy
        run: uv run pyside6-deploy main.py --force

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          asset="youtube-bootlegger-${{ github.event.release.tag_name }}-linux-x64.tar.gz"
          chmod +x YouTubeBootlegger.bin
          tar -czf "$asset" YouTubeBootlegger.bin
          echo "ASSET_PATH=$asset" >> "$GITHUB_ENV"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "youtube-bootlegger-${{ github.event.release.tag_name }}-windows-x64.zip"
          Compress-Archive -Path YouTubeBootlegger.exe -DestinationPath $asset
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET_PATH=$asset"

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          asset="youtube-bootlegger-${{ github.event.release.tag_name }}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent YouTubeBootlegger.app "$asset"
          echo "ASSET_PATH=$asset" >> "$GITHUB_ENV"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ env.ASSET_PATH }}" --clobber --repo "${{ github.repository }}"
