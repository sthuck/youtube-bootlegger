name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.ui }} (${{ matrix.target.platform }})
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ui: [qml, tui]
        target:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-xkb1 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0

      - name: Install dependencies
        run: uv sync --dev --locked

      # Folder bundles avoid C compilation and onefile compression/extraction.
      # Each frontend has its own console mode and dependency collection.
      - name: Build executable
        run: uv run --no-sync pyinstaller --noconfirm main.spec -- --ui ${{ matrix.ui }}

      - name: Package artifact
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || github.sha }}
        shell: bash
        run: >-
          uv run --no-sync python scripts/package_release.py
          --ui "${{ matrix.ui }}"
          --platform "${{ matrix.target.platform }}"
          --version "$RELEASE_VERSION"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ui }}-${{ matrix.target.platform }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Publish six release assets
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" assets/* --clobber
