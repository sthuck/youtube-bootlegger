<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144">
  <defs>
    <!-- Deep sleek obsidian background -->
    <linearGradient id="bg" x1="0" y1="0" x2="144" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b2e"/>
      <stop offset="100%" stop-color="#0b0b12"/>
    </linearGradient>

    <!-- Subtle top-edge glass highlight -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.28"/>
    </linearGradient>

    <!-- Vinyl disc sheen -->
    <linearGradient id="disc" x1="26" y1="26" x2="118" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#28283e"/>
      <stop offset="50%" stop-color="#141422"/>
      <stop offset="100%" stop-color="#221e38"/>
    </linearGradient>

    <!-- YouTube crimson to electric violet accent -->
    <linearGradient id="accent" x1="36" y1="36" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="55%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Play prism gradient -->
    <linearGradient id="play" x1="58" y1="54" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="8" y="8" width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect x="9" y="9" width="126" height="126" rx="29" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <!-- Outer Vinyl Record Body -->
  <circle cx="72" cy="72" r="48" fill="url(#disc)"/>
  <circle cx="72" cy="72" r="48" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Segmented Track Grooves (representing split audio tracks) -->
  <!-- Outer track ring (3 split segments) -->
  <circle cx="72" cy="72" r="40" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="68 16 48 16 71 100"/>
  <!-- Mid track ring (subtle metallic groove segments) -->
  <circle cx="72" cy="72" r="33" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" stroke-dasharray="42 14 58 14 48 100" transform="rotate(35 72 72)"/>

  <!-- Center Record Label (Vibrant Gradient Badge) -->
  <circle cx="72" cy="72" r="23" fill="url(#accent)"/>
  <circle cx="72" cy="72" r="22.25" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Sleek Sliced Play Triangle (Live Stream -> Split Audio) -->
  <!-- Left vertical bar (track slice) -->
  <rect x="61.5" y="59.5" width="4.5" height="25" rx="2.25" fill="url(#play)"/>
  <!-- Right play wedge -->
  <path d="M 69.5 61.3 C 69.5 59.9 71.1 59.1 72.3 59.8 L 85.8 68.2 C 87.0 68.9 87.0 70.6 85.8 71.4 L 72.3 79.8 C 71.1 80.5 69.5 79.7 69.5 78.3 Z" transform="translate(0 2.2)" fill="url(#play)"/>
</svg>
