<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Bootlegger logo</title>
  <desc id="desc">A dark rounded app icon with a vinyl record, play button, waveform, and split track markers.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="900" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#202045"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#07070f"/>
    </linearGradient>
    <linearGradient id="edge" x1="150" y1="92" x2="862" y2="932" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="record" cx="46%" cy="40%" r="62%">
      <stop offset="0" stop-color="#3f3f58"/>
      <stop offset="0.36" stop-color="#191927"/>
      <stop offset="1" stop-color="#050509"/>
    </radialGradient>
    <linearGradient id="play" x1="334" y1="322" x2="690" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4f5e"/>
      <stop offset="0.56" stop-color="#ef233c"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="wave" x1="285" y1="714" x2="739" y2="714" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="928" rx="204" fill="none" stroke="url(#edge)" stroke-width="18" opacity="0.9"/>
  <circle cx="512" cy="508" r="292" fill="url(#record)" filter="url(#shadow)"/>
  <circle cx="512" cy="508" r="236" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.1"/>
  <circle cx="512" cy="508" r="185" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.08"/>
  <circle cx="512" cy="508" r="132" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.07"/>
  <circle cx="512" cy="508" r="68" fill="#0f1020" stroke="#64748b" stroke-width="10"/>
  <circle cx="512" cy="508" r="24" fill="#e5e7eb"/>

  <rect x="294" y="318" width="436" height="284" rx="92" fill="url(#play)" filter="url(#shadow)"/>
  <path d="M470 395L470 525L584 460Z" fill="#fff7ed"/>
  <path d="M342 650C388 616 433 616 479 650C525 684 570 684 616 650C662 616 707 616 752 650" fill="none" stroke="url(#wave)" stroke-width="32" stroke-linecap="round"/>
  <path d="M342 728H682" fill="none" stroke="url(#wave)" stroke-width="34" stroke-linecap="round"/>
  <path d="M732 728H770" fill="none" stroke="#fb7185" stroke-width="34" stroke-linecap="round"/>
  <path d="M420 689V767M512 689V767M604 689V767" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" opacity="0.92"/>
